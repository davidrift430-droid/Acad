# Builds the Android APK (Capacitor) and publishes it as a GitHub Release you can download on your phone.
name: Android APK
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/DymoTraining-2.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DymoTraining-apk
          path: out/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v2.0.${{ github.run_number }}
          name: Dymo Training 2.0.${{ github.run_number }} (APK)
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: out/*.apk
          body: |
            📱 **Instalar no Android:** baixe o arquivo `.apk` abaixo no celular, abra e permita "instalar de fontes desconhecidas".
            Build de teste (assinatura debug) gerado a partir de ${{ github.sha }}.
